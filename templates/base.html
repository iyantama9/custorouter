<!DOCTYPE html>
<html lang="en" x-data="{ dark: document.documentElement.classList.contains('dark') }" :class="dark ? 'dark' : ''">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CustoRouter{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="alternate icon" href="/static/favicon.svg">

  <script>
    // Applies the saved theme before first paint. Alpine's own x-data (and
    // the Tailwind CDN script below) only run after the full document is
    // parsed, so without this the page always paints light-mode first, then
    // flips -- a flash on every single reload, worse for anyone who actually
    // prefers light mode since it then flips a second time once dashboard.html's
    // own init() re-applies the saved preference.
    (function () {
      var saved = localStorage.getItem('theme');
      if (saved ? saved === 'dark' : true) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <link rel="stylesheet" href="/static/tailwind.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=optional"
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=optional" rel="stylesheet"></noscript>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.3/dist/cdn.min.js"></script>
  <script defer src="https://unpkg.com/lucide@1.46.0/dist/umd/lucide.min.js" onload="window.refreshLucideIcons()"></script>
  <script>
    // Coalesce icon rendering and keep already-rendered SVGs out of future
    // document-wide scans. Re-scanning every icon after each reactive update
    // was particularly expensive on low-power Android devices.
    (function () {
      var scheduled = false;
      window.refreshLucideIcons = function () {
        if (scheduled) return;
        scheduled = true;
        var render = function () {
          scheduled = false;
          if (!window.lucide) return;
          window.lucide.createIcons();
          document.querySelectorAll('svg[data-lucide]').forEach(function (svg) {
            svg.setAttribute('data-icon', svg.getAttribute('data-lucide'));
            svg.removeAttribute('data-lucide');
          });
        };
        if ('requestIdleCallback' in window) requestIdleCallback(render, { timeout: 250 });
        else setTimeout(render, 0);
      };
    })();
  </script>

  <style>
    :root {
      --background: 0 0% 98%;
      --foreground: 0 0% 8%;
      --card: 0 0% 100%;
      --card-foreground: 0 0% 8%;
      --primary: 0 0% 12%;
      --primary-foreground: 0 0% 100%;
      --secondary: 0 0% 93%;
      --secondary-foreground: 0 0% 8%;
      --muted: 0 0% 93%;
      --muted-foreground: 0 0% 34%;
      --accent: 0 0% 38%;
      --accent-foreground: 0 0% 100%;
      --destructive: 0 72% 51%;
      --destructive-foreground: 0 0% 100%;
      --success: 142 71% 34%;
      --success-foreground: 0 0% 100%;
      --border: 0 0% 88%;
      --input: 0 0% 88%;
      --ring: 0 0% 12%;
      --radius: 0.875rem;
    }

    .dark {
      --background: 0 0% 8%;
      --foreground: 0 0% 92%;
      --card: 0 0% 7%;
      --card-foreground: 0 0% 92%;
      --primary: 0 0% 96%;
      --primary-foreground: 0 0% 8%;
      --secondary: 0 0% 11%;
      --secondary-foreground: 0 0% 92%;
      --muted: 0 0% 11%;
      --muted-foreground: 0 0% 82%;
      --accent: 0 0% 70%;
      --accent-foreground: 0 0% 8%;
      --destructive: 0 72% 51%;
      --destructive-foreground: 0 0% 100%;
      --success: 142 65% 45%;
      --success-foreground: 0 0% 8%;
      --border: 0 0% 15%;
      --input: 0 0% 11%;
      --ring: 0 0% 96%;
    }

    /* Interactive dot grid.

       This lives on its own fixed layer rather than on body/.grid-bg. The
       previous version set an animated `color` on those elements so the dot
       gradient could use currentColor -- but `color` inherits, so every bit
       of text without an explicit colour inherited the animation too and
       visibly flickered. Nothing here touches text colour. */
    .dot-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      --dot-size: 26px;
      --dot-base: rgba(255, 255, 255, 0.13);
      --dot-hot: rgba(255, 255, 255, 0.85);
      --spot: 190px;
      background-image: radial-gradient(var(--dot-base) 1.3px, transparent 1.3px);
      background-size: var(--dot-size) var(--dot-size);
    }
    html:not(.dark) .dot-layer {
      --dot-base: rgba(0, 0, 0, 0.11);
      --dot-hot: rgba(0, 0, 0, 0.6);
    }

    /* Dots near the cursor are redrawn larger on a canvas layered on top.
       CSS can't scale individual gradient dots, so the swell has to be
       painted per-dot rather than masked. */
    #dot-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Force readable body text in rendered markdown regardless of whether the
       Tailwind Typography plugin loaded from the CDN build — it isn't
       guaranteed, and its default palette runs dimmer than our tokens. */
    .prose {
      color: hsl(var(--foreground));
    }
    .prose :where(p, li, strong, b, em, blockquote, h1, h2, h3, h4, h5, h6, td, th) {
      color: inherit;
    }
    .prose code {
      color: hsl(var(--foreground));
    }
    .prose a {
      color: hsl(var(--primary));
    }
    /* Chat images: clamp so a large generation can't blow out the bubble,
       and signal that clicking downloads it. */
    .prose img.chat-image {
      max-width: 100%;
      max-height: 420px;
      height: auto;
      border-radius: 0.75rem;
      border: 1px solid hsl(var(--border));
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .prose img.chat-image:hover { opacity: 0.85; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: hsl(var(--muted-foreground)); }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .animate-shimmer {
      background: linear-gradient(90deg, hsl(var(--secondary)) 25%, hsl(var(--muted)) 50%, hsl(var(--secondary)) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes toast-in {
      from { transform: translateX(110%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .toast-enter {
      animation: toast-in 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Routing graph: a dash that marches from the hub out to the provider,
       so an in-flight request reads as something actually travelling the wire. */
    @keyframes connector-flow {
      from { stroke-dashoffset: 24; }
      to   { stroke-dashoffset: 0; }
    }
    .connector-live {
      stroke-dasharray: 6 6;
      animation: connector-flow 0.55s linear infinite;
      filter: drop-shadow(0 0 3px hsl(var(--primary) / 0.6));
    }

    @keyframes pulse-dot {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(3); opacity: 0; }
    }
    .pulse-ring::after {
      content: '';
      position: absolute; inset: 0; border-radius: 50%;
      background: inherit;
      animation: pulse-dot 2s ease-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-shimmer { animation: none; background: hsl(var(--secondary)); }
      .pulse-ring::after { animation: none; }
      .connector-live { animation: none; stroke-dasharray: none; }
    }

    /* Mobile GPUs pay heavily for fixed canvases and backdrop filters while
       scrolling. Keep the static grid, but remove continuous compositing on
       coarse-pointer devices. */
    @media (max-width: 767px), (pointer: coarse) {
      .dot-layer { position: absolute; min-height: 100vh; }
      #dot-canvas { display: none; }
      .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-xl {
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
      }
      .connector-live {
        animation: none;
        filter: none;
        stroke-dasharray: none;
      }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-background text-foreground font-body antialiased">
  <div class="dot-layer" id="dot-layer" aria-hidden="true">
    <canvas id="dot-canvas"></canvas>
  </div>
  {% block content %}{% endblock %}

  <script>
    // Dot grid that swells toward the cursor.
    //
    // The static grid is the CSS background on .dot-layer. This canvas only
    // repaints the dots inside the cursor's radius, drawing them larger and
    // brighter -- so it's a few hundred arcs a frame, not the whole viewport.
    (function () {
      var layer = document.getElementById('dot-layer');
      var canvas = document.getElementById('dot-canvas');
      if (!layer || !canvas || !canvas.getContext) return;
      // The dashboard prioritizes interaction and live data over this
      // decorative pointer animation, including on desktop GPUs.
      if (document.querySelector('[x-data="dashboard()"]')) {
        canvas.remove();
        return;
      }
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return;

      var ctx = canvas.getContext('2d');
      var SPACING = 26;      // must match --dot-size
      var OFFSET = 13;       // gradient dots sit at the centre of each tile
      var BASE_R = 1.3;      // matches the CSS dot radius
      var MAX_R = 4.6;       // how big a dot gets right under the cursor
      var SPOT = 175;        // influence radius

      var w = 0, h = 0, dpr = 1;
      var curX = -9999, curY = -9999;     // eased position actually drawn
      var tgtX = -9999, tgtY = -9999;     // where the pointer really is
      var raf = null;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        // Only ask for a frame if there's actually something to paint. Setting
        // canvas.width already cleared it, and scheduling here before the
        // pointer is known would leave `raf` pending in a backgrounded tab --
        // which blocks every later schedule() until that frame finally lands.
        if (curX > -1000) schedule();
      }

      function dotRGB() {
        return document.documentElement.classList.contains('dark') ? '255,255,255' : '0,0,0';
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        if (curX < -1000) return;
        var rgb = dotRGB();
        var nMin = Math.floor((curX - SPOT - OFFSET) / SPACING);
        var nMax = Math.ceil((curX + SPOT - OFFSET) / SPACING);
        var mMin = Math.floor((curY - SPOT - OFFSET) / SPACING);
        var mMax = Math.ceil((curY + SPOT - OFFSET) / SPACING);
        for (var n = nMin; n <= nMax; n++) {
          var x = OFFSET + n * SPACING;
          if (x < -SPACING || x > w + SPACING) continue;
          for (var m = mMin; m <= mMax; m++) {
            var y = OFFSET + m * SPACING;
            if (y < -SPACING || y > h + SPACING) continue;
            var dx = x - curX, dy = y - curY;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > SPOT) continue;
            // squared falloff: the swell stays tight around the pointer
            var t = 1 - dist / SPOT;
            var ease = t * t;
            ctx.beginPath();
            ctx.arc(x, y, BASE_R + ease * (MAX_R - BASE_R), 0, 6.283185307179586);
            ctx.fillStyle = 'rgba(' + rgb + ',' + (0.13 + ease * 0.72).toFixed(3) + ')';
            ctx.fill();
          }
        }
      }

      function tick() {
        raf = null;
        // ease toward the pointer so the bulge trails rather than snapping
        curX += (tgtX - curX) * 0.2;
        curY += (tgtY - curY) * 0.2;
        draw();
        if (Math.abs(tgtX - curX) > 0.4 || Math.abs(tgtY - curY) > 0.4) schedule();
      }

      function schedule() {
        if (raf === null) raf = requestAnimationFrame(tick);
      }

      window.addEventListener('pointermove', function (e) {
        if (curX < -1000) { curX = e.clientX; curY = e.clientY; }  // no fly-in on first move
        tgtX = e.clientX;
        tgtY = e.clientY;
        schedule();
      }, { passive: true });

      document.addEventListener('pointerleave', function () {
        tgtX = -9999; tgtY = -9999; curX = -9999; curY = -9999;
        schedule();
      });

      window.addEventListener('resize', resize, { passive: true });
      resize();
    })();
  </script>
  <script>window.refreshLucideIcons();</script>
  {% block scripts %}{% endblock %}
</body>
</html>
