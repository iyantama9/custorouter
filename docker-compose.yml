services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-router-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: llm_router
      POSTGRES_USER: llm_router_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./neon_backup.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_router_user -d llm_router"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: llm-router-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"  # host nginx is the only public entrypoint
    environment:
      - DATABASE_URL=postgresql://llm_router_user:${POSTGRES_PASSWORD}@postgres:5432/llm_router
      # Must match the port uvicorn actually binds (see Dockerfile CMD). Playground
      # calls http://127.0.0.1:$PORT/v1/messages internally, so a mismatch here
      # breaks the Playground with "All connection attempts failed".
      - PORT=4000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./static:/app/static
      - ./ssl:/app/ssl:ro  # Mount SSL certificates (read-only)
      - ./.env:/app/.env    # so /api/models/refresh writes persist on the host
    networks:
      - default
      # Cloudflared's remotely-managed `nas-tunnel` is in this network.  The
      # app remains private: the router gets no host-published application port.
      - nas_tunnel

  copilot-api:
    build: ../copilot-api
    container_name: copilot-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4141:4141"  # loopback only -- no auth of its own once running
    volumes:
      - copilot_api_data:/root/.local/share/copilot-api  # persists the GitHub auth token

volumes:
  postgres_data:
    driver: local
  copilot_api_data:
    driver: local

networks:
  nas_tunnel:
    external: true
    name: app_default
