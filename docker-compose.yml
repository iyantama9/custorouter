services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-router-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: llm_router
      POSTGRES_USER: llm_router_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_router_user -d llm_router"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.2-alpine
    container_name: llm-router-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: llm-router-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"  # host nginx is the only public entrypoint
    environment:
      - DATABASE_URL=postgresql://llm_router_user:${POSTGRES_PASSWORD}@postgres:5432/llm_router
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # Must match the port uvicorn actually binds (see Dockerfile CMD). Playground
      # calls http://127.0.0.1:$PORT/v1/messages internally, so a mismatch here
      # breaks the Playground with "All connection attempts failed".
      - PORT=4000
      # The collector is internal-only; the app uses batched HTTP OTLP export.
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://otel-collector:4318/v1/traces
      - OTEL_SERVICE_NAME=llm-router
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./static:/app/static
      - ./ssl:/app/ssl:ro  # Mount SSL certificates (read-only)
      - ./.env:/app/.env    # so /api/models/refresh writes persist on the host
    networks:
      - default
      # Cloudflared's remotely-managed `nas-tunnel` is in this network.  The
      # app remains private: the router gets no host-published application port.
      - nas_tunnel

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: llm-router-prometheus
    restart: unless-stopped
    environment:
      - METRICS_TOKEN=${METRICS_TOKEN:?METRICS_TOKEN must be set}
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      sed "s|__METRICS_TOKEN__|$${METRICS_TOKEN}|g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml &&
      exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d --web.enable-lifecycle=false
    volumes:
      - ./observability/prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
      - prometheus_data:/prometheus
    ports:
      # 9090 belongs to an unrelated host monitoring stack on production.
      - "127.0.0.1:9091:9090"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 384m

  tempo:
    image: grafana/tempo:3.0.3
    container_name: llm-router-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo/config.yml:ro
      - tempo_data:/var/tempo
    mem_limit: 256m

  otel-collector:
    image: otel/opentelemetry-collector:0.161.0
    container_name: llm-router-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - tempo
    mem_limit: 192m

  grafana:
    image: grafana/grafana:13.1.6
    container_name: llm-router-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=iyanadmin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # 3000 belongs to another host Grafana instance on production.
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - tempo
    mem_limit: 384m

  copilot-api:
    build: ../copilot-api
    container_name: copilot-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4141:4141"  # loopback only -- no auth of its own once running
    volumes:
      - copilot_api_data:/root/.local/share/copilot-api  # persists the GitHub auth token

volumes:
  postgres_data:
    driver: local
  copilot_api_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  tempo_data:
    driver: local
  grafana_data:
    driver: local

networks:
  nas_tunnel:
    external: true
    name: app_default
