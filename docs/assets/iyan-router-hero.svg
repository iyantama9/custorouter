<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Iyan Router</title>
  <desc id="desc">A dark technical diagram showing client requests routed through policy and provider layers to multiple AI models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110e"/>
      <stop offset="0.55" stop-color="#0d1415"/>
      <stop offset="1" stop-color="#101114"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35e6a1"/>
      <stop offset="1" stop-color="#39bfff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#98a4a0" stroke-opacity=".08"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="25" fill="none" stroke="#33403d"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="70" y="88" fill="#7d938c" font-size="13" font-weight="700" letter-spacing="4">MULTI PROVIDER LLM GATEWAY</text>
    <text x="70" y="155" fill="#f4f7f6" font-size="56" font-weight="750" letter-spacing="7">IYAN ROUTER</text>
    <text x="72" y="192" fill="#a8b3af" font-size="17" letter-spacing="1.5">Compatible APIs  ·  policy  ·  rotation  ·  telemetry  ·  memory</text>
    <g transform="translate(72 255)">
      <rect width="150" height="56" rx="12" fill="#151d1b" stroke="#2d4540"/>
      <circle cx="27" cy="28" r="7" fill="#35e6a1"/>
      <text x="48" y="34" fill="#dce6e2" font-size="14" font-weight="700">CLIENTS</text>
    </g>
    <path d="M222 283H338" stroke="url(#line)" stroke-width="3"/>
    <path d="m327 274 14 9-14 9" fill="none" stroke="#35e6a1" stroke-width="3"/>
    <g transform="translate(340 235)" filter="url(#glow)">
      <rect width="250" height="96" rx="18" fill="#10221c" stroke="#35e6a1"/>
      <text x="125" y="41" text-anchor="middle" fill="#f3f8f6" font-size="17" font-weight="750">ROUTE + POLICY</text>
      <text x="125" y="67" text-anchor="middle" fill="#70d9b4" font-size="12" letter-spacing="1.5">AUTH  ALIAS  QUOTA</text>
    </g>
    <path d="M590 283H706" stroke="url(#line)" stroke-width="3"/>
    <path d="m695 274 14 9-14 9" fill="none" stroke="#39bfff" stroke-width="3"/>
    <g transform="translate(708 248)">
      <rect width="142" height="70" rx="14" fill="#151d1f" stroke="#345057"/>
      <text x="71" y="31" text-anchor="middle" fill="#f1f5f4" font-size="14" font-weight="700">PROVIDER A</text>
      <text x="71" y="51" text-anchor="middle" fill="#839894" font-size="11">PRIMARY</text>
    </g>
    <g transform="translate(874 248)">
      <rect width="142" height="70" rx="14" fill="#151d1f" stroke="#345057"/>
      <text x="71" y="31" text-anchor="middle" fill="#f1f5f4" font-size="14" font-weight="700">PROVIDER B</text>
      <text x="71" y="51" text-anchor="middle" fill="#839894" font-size="11">ROTATION</text>
    </g>
    <g transform="translate(1040 248)">
      <rect width="90" height="70" rx="14" fill="#151d1f" stroke="#345057"/>
      <text x="45" y="43" text-anchor="middle" fill="#39bfff" font-size="22" font-weight="700">+N</text>
    </g>
    <path d="M850 283H874M1016 283H1040" stroke="#36575c" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="72" y="375" fill="#60736d" font-size="11" font-weight="700" letter-spacing="3">STREAMING READY</text>
    <text x="1128" y="375" text-anchor="end" fill="#60736d" font-size="11" font-weight="700" letter-spacing="3">BRAIN ENABLED</text>
  </g>
